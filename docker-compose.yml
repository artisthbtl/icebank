version: '3.8'

services:
    # --------------------------------------------------------------------------
    # 1. APPLICATION SERVICE (PHP-FPM)
    # Runs the Laravel framework code.
    # --------------------------------------------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: icebank_app
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - .env
        volumes:
            - .:/var/www/html
        depends_on:
            - db
        networks:
            - icebank-network

    # --------------------------------------------------------------------------
    # 2. WEB SERVER (NGINX)
    # Serves the app on port 8000 to the host.
    # --------------------------------------------------------------------------
    nginx:
        image: nginx:stable-alpine
        container_name: icebank_nginx
        restart: unless-stopped
        ports:
            - "8000:80" # Maps host port 8000 to Nginx port 80
        volumes:
            - .:/var/www/html
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf # Custom config
        depends_on:
            - app
        networks:
            - icebank-network

    # --------------------------------------------------------------------------
    # 3. QUEUE WORKER
    # Executes php artisan queue:listen (for jobs).
    # --------------------------------------------------------------------------
    worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: icebank_worker
        restart: unless-stopped
        working_dir: /var/www/html
        entrypoint: /usr/bin/php /var/www/html/artisan queue:listen --tries=3 --timeout=60
        env_file:
            - .env
        volumes:
            - .:/var/www/html
        depends_on:
            - db
        networks:
            - icebank-network

    # --------------------------------------------------------------------------
    # 4. SCHEDULER SERVICE
    # Executes php artisan schedule:work (for RenewSubscription command).
    # --------------------------------------------------------------------------
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: icebank_scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        entrypoint: /usr/bin/php /var/www/html/artisan schedule:work
        env_file:
            - .env
        volumes:
            - .:/var/www/html
        depends_on:
            - db
        networks:
            - icebank-network

    # --------------------------------------------------------------------------
    # 5. DATABASE (MySQL)
    # Provides persistent storage.
    # --------------------------------------------------------------------------
    db:
        image: mysql:8.0
        container_name: icebank_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-icebank_db}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_USER: ${DB_USERNAME:-icebank_user}
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - icebank_db_data:/var/lib/mysql
        networks:
            - icebank-network

volumes:
    icebank_db_data:

networks:
    icebank-network:
        driver: bridge